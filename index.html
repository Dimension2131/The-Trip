    :root {

      --text: #e2e8e0;
      --sub: #9bb5a5;
      --accent: #2dd4a8;
      --accent-glow: rgba(45,212,168,0.3);
      --radius: 1.5rem;
      --radius-sm: 0.75rem;

      --transition: 0.25s ease;
      --glass-blur: blur(16px);
    }
    * { margin:0; padding:0; box-sizing:border-box; }

      background: radial-gradient(ellipse at 50% 0%, #0e2a1f 0%, #040906 70%);
      background-attachment: fixed;
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
      padding: 2rem 1.5rem;
    }

    .password-gate {
      position: fixed; top:0; left:0; width:100%; height:100%;
      background: rgba(0,0,0,0.85); backdrop-filter: blur(12px);
      display: flex; align-items: center; justify-content: center;
      z-index: 9999; transition: opacity 0.4s;
    }
    .password-gate.hidden { opacity: 0; pointer-events: none; }
    .gate-box {
      background: var(--card-bg); backdrop-filter: var(--glass-blur);
      border: 1px solid var(--card-border); border-radius: var(--radius);
      padding: 2.5rem; text-align: center; max-width: 400px; width: 90%;
      box-shadow: var(--shadow);
    }
    .gate-box h2 { font-size: 2rem; margin-bottom: 1rem; color: var(--accent); }
    .gate-box input {
      width: 100%; padding: 0.8rem; background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.15); border-radius: 0.5rem;
      color: white; font-size: 1rem; margin: 0.8rem 0;
    }
    .gate-box input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 12px var(--accent-glow); }
    .gate-box button {
      background: var(--accent); color: #0a0f0c; border: none; padding: 0.8rem 2rem;
      border-radius: 2rem; font-weight: 700; font-size: 1rem; cursor: pointer; transition: var(--transition);
    }
    .gate-box button:hover { background: #40f0c0; box-shadow: 0 0 16px var(--accent-glow); }
    .gate-error { color: #ff6b6b; margin-top: 0.5rem; font-size: 0.9rem; }

    .container { max-width: 1350px; margin: 0 auto; }
    header { text-align: center; margin-bottom: 3rem; }
    h1 {
      font-size: clamp(2.5rem, 7vw, 3.6rem);
      background: linear-gradient(to right, #2dd4a8, #8bf0cf);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
      font-weight: 800; letter-spacing: -0.02em;
    }
    .subtitle { color: var(--sub); font-size: 1.1rem; margin-top: 0.4rem; }

    .trips-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(360px, 1fr)); gap: 2rem;
    }

    .trip-card {
      background: var(--card-bg); backdrop-filter: var(--glass-blur);
      border: 1px solid var(--card-border); border-radius: var(--radius);
      padding: 2rem; display: flex; flex-direction: column;
      transition: transform var(--transition), box-shadow var(--transition); box-shadow: var(--shadow);
    }
    .trip-card:hover { transform: translateY(-6px); box-shadow: 0 20px 40px rgba(0,0,0,0.6), 0 0 20px var(--accent-glow); }

    .trip-header { display: flex; align-items: center; gap: 1rem; margin-bottom: 1rem; }
    .trip-icon { font-size: 2.5rem; filter: drop-shadow(0 0 8px var(--accent-glow)); }
    .trip-card h2 {
      font-size: 2rem; font-weight: 700;
      background: linear-gradient(135deg, #e2e8e0, #b4f0d5);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }

    .activities { list-style: none; display: flex; flex-wrap: wrap; gap: 0.5rem; margin: 1rem 0 1.5rem; }
    .activities li {
      background: rgba(45,212,168,0.1); border: 1px solid rgba(45,212,168,0.3);
      color: #b4f0d5; padding: 0.3rem 1rem; border-radius: 30px; font-size: 0.85rem;
    }
    .travel-time {
      display: flex; align-items: center; gap: 0.5rem; color: var(--sub); font-weight: 500;
      margin-bottom: 1.5rem; background: rgba(255,255,255,0.03); padding: 0.4rem 1rem;
      border-radius: 0.5rem; width: fit-content; border: 1px solid rgba(255,255,255,0.05);
    }

    .accommodations h3 { font-size: 1.3rem; font-weight: 700; margin-bottom: 0.8rem; color: var(--accent); }
    .acc-list { display: flex; flex-direction: column; gap: 0.75rem; }
    .acc-item {
      background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06);
      border-radius: var(--radius-sm); padding: 1rem; display: flex; flex-wrap: wrap;
      align-items: center; justify-content: space-between; transition: border var(--transition);
    }
    .acc-item:hover { border-color: var(--accent); }
    .acc-name-price { flex: 1; }
    .acc-name { font-weight: 700; color: #fff; display: block; }
    .acc-price { color: var(--sub); font-size: 0.9rem; margin-top: 0.3rem; }
    .acc-buttons { display: flex; gap: 0.5rem; }

    .btn {
      background: var(--accent); color: #0a221a; border: none; padding: 0.5rem 1.2rem;
      border-radius: 2rem; cursor: pointer; font-size: 0.85rem; font-weight: 700;
      transition: var(--transition); text-decoration: none; display: inline-flex; align-items: center; gap: 0.3rem;

    .btn.outline:hover { background: rgba(45,212,168,0.1); color: #fff; }

    .vote-section { margin-top: 1.8rem; display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }

      background: #2dd4a8; font-weight: 800; padding: 0.6rem 1.6rem; font-size: 1rem; border-radius: 2rem;

    }
    function getVotedTrip() { return localStorage.getItem('votedTrip') || null; }
    function setVotedTrip(tripId) { localStorage.setItem('votedTrip', tripId); }

    // ---------- FIREBASE VOTING ----------
    async function castVote(tripId, voterId, displayName) {
      const voteRef = db.collection('votes').doc(voterId);
      await db.runTransaction(async (transaction) => {
        const doc = await transaction.get(voteRef);
        if (doc.exists) throw new Error('ALREADY_VOTED');
        transaction.set(voteRef, { tripId, displayName: displayName || 'Anonymous', timestamp: firebase.firestore.FieldValue.serverTimestamp() });
      });
    }

    let currentVoteCounts = {};
    function listenVotes() {
      db.collection('votes').onSnapshot(snapshot => {
        const counts = {};
        snapshot.forEach(doc => { const d = doc.data(); counts[d.tripId] = (counts[d.tripId]||0)+1; });
        currentVoteCounts = counts;
        updateAllVoteDisplays();
      });
    }

    // ---------- FIREBASE COMMENTS ----------
    function listenComments(tripId, callback) {
      db.collection('comments')
        .where('tripId', '==', tripId)
        .onSnapshot(snapshot => {
      const comments = [];
      snapshot.forEach(doc => comments.push({ id: doc.id, ...doc.data() }));
      // Sort client-side (newest last)
      comments.sort((a, b) => (a.timestamp?.toMillis() || 0) - (b.timestamp?.toMillis() || 0));
      callback(comments);
    });
    }

    async function addComment(tripId, name, text) {
      await db.collection('comments').add({ tripId, name: name || 'Anonymous', text, timestamp: firebase.firestore.FieldValue.serverTimestamp() });
    }

    // ---------- BUILD STATIC UI ----------
    function buildStaticUI() {
      const container = document.getElementById('tripsContainer');
      container.innerHTML = '';
      trips.forEach(trip => {
        const card = document.createElement('div');
        card.className = 'trip-card';
        card.innerHTML = `
          <div class="trip-header"><span class="trip-icon">${trip.emoji}</span><h2>${trip.name}</h2></div>
          <ul class="activities">${trip.activities.map(a => `<li>${a}</li>`).join('')}</ul>
          ${trip.travelTime ? `<div class="travel-time">🚗 ${trip.travelTime}</div>` : ''}
          <div class="accommodations">
            <h3>🏡 Accommodation</h3>
            <div class="acc-list">
              ${trip.accommodations.map(acc => `
                <div class="acc-item">
                  <div class="acc-name-price">
                    <span class="acc-name">${acc.name}</span>
                    <span class="acc-price">💰 LKR ${acc.price.toLocaleString()}${acc.rooms ? ` (${acc.rooms} rooms)` : ''}</span>
                  </div>
                  <div class="acc-buttons">
                    <button class="btn outline" data-details="${encodeURIComponent(acc.details)}">More Info</button>
                    <a href="${acc.link}" target="_blank" class="btn outline">Booking →</a>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
          <div class="vote-section">
            <button class="btn vote-btn" data-trip-id="${trip.id}">Vote this trip</button>
            <span class="vote-count" data-trip-id="${trip.id}">❤️ 0</span>
          </div>
          <div class="comment-wall">
            <h4>💬 Live Wall</h4>
            <div class="comment-input">
              <input type="text" placeholder="Name" class="comment-name">
              <textarea placeholder="Your thought..." class="comment-text"></textarea>
              <button class="send-comment-btn" data-trip-id="${trip.id}">→</button>
            </div>
            <div class="live-comments" data-trip-id="${trip.id}"></div>
          </div>
        `;
        container.appendChild(card);
      });

      // Attach static event listeners
      document.querySelectorAll('.btn[data-details]').forEach(btn => {
        btn.addEventListener('click', () => openModal(decodeURIComponent(btn.dataset.details)));
      });
      document.querySelectorAll('.vote-btn').forEach(btn => {
        btn.addEventListener('click', async () => {
          if (getVotedTrip()) { alert('You already voted.'); return; }
          const tripId = btn.dataset.tripId;
          const name = prompt('Your name') || 'Anonymous';
          const voterId = getVoterId();
          try {
            await castVote(tripId, voterId, name);
            setVotedTrip(tripId);
            updateAllVoteDisplays();
          } catch(e) {
            alert(e.message.includes('ALREADY_VOTED') ? 'You already voted' : 'Error voting.');
          }
        });
      });
      document.querySelectorAll('.send-comment-btn').forEach(btn => {
        btn.addEventListener('click', async () => {
          const tripId = btn.dataset.tripId;
          const nameInput = btn.parentElement.querySelector('.comment-name');
          const textInput = btn.parentElement.querySelector('.comment-text');
          const text = textInput.value.trim();
          if (!text) return;
          await addComment(tripId, nameInput.value.trim(), text);
          textInput.value = '';
        });
      });
    }

    function updateAllVoteDisplays() {
      const votedTrip = getVotedTrip();
      document.querySelectorAll('.vote-btn').forEach(btn => {
        const tripId = btn.dataset.tripId;
        if (votedTrip && votedTrip !== tripId) {
          btn.disabled = true;
          btn.textContent = 'Already voted';
        } else if (votedTrip === tripId) {
          btn.disabled = true;
          btn.textContent = '✅ Voted';
        } else {
          btn.disabled = false;
          btn.textContent = 'Vote this trip';
        }
      });
      document.querySelectorAll('.vote-count').forEach(span => {
        const tripId = span.dataset.tripId;
        span.textContent = `❤️ ${currentVoteCounts[tripId] || 0}`;
      });
    }

    function startCommentListeners() {
      trips.forEach(trip => {
        const listEl = document.querySelector(`.live-comments[data-trip-id="${trip.id}"]`);
        if (!listEl) return;
        listenComments(trip.id, comments => {
          listEl.innerHTML = comments.map(c => `<div class="comment-item"><strong>${c.name}</strong> ${c.text}</div>`).join('');
        });
      });
    }

    // ---------- MODAL ----------
    window.openModal = function(details) {
      document.getElementById('modalBody').innerHTML = `<div class="facilities-block">${details.replace(/\n/g, '<br>')}</div>`;
      document.getElementById('infoModal').classList.add('open');
    };
    window.closeModal = function() { document.getElementById('infoModal').classList.remove('open'); };
    document.getElementById('infoModal').addEventListener('click', (e) => { if (e.target === e.currentTarget) closeModal(); });

    // ---------- BUDGET ----------
    function updateBudget() {
    const people = parseInt(document.getElementById('numPeople').value) || 10;
    const daily = parseInt(document.getElementById('dailyExtra').value) || 4000;
    const nights = parseInt(document.getElementById('numNights').value) || 2;
    const tbody = document.querySelector('#budgetTable tbody');
    tbody.innerHTML = '';

    trips.forEach(trip => {
      trip.accommodations.forEach(acc => {
        const nightlyRate = Math.round(acc.price / 2);
        const accTotal = nightlyRate * nights;
        const extraTotal = daily * people * nights;
        const grandTotal = accTotal + extraTotal;
        const perPerson = Math.round(grandTotal / people);

        const row = document.createElement('tr');
        row.innerHTML = `
          <td>${trip.emoji} ${trip.name} → ${acc.name}</td>
          <td>LKR ${accTotal.toLocaleString()}</td>
          <td>LKR ${extraTotal.toLocaleString()}</td>
          <td><strong>LKR ${grandTotal.toLocaleString()}</strong></td>
          <td>LKR ${perPerson.toLocaleString()}</td>
        `;
        tbody.appendChild(row);
        });
      });
    }
    function initBudget() {
      document.getElementById('budgetTable').innerHTML = `<thead><tr><th>Trip / Accommodation</th><th>Stay</th><th>Food&nbsp;&&nbsp;Extras</th><th>Total</th><th>Per Person</th></tr></thead><tbody></tbody>`;
      updateBudget();
      document.getElementById('numPeople').addEventListener('input', updateBudget);
      document.getElementById('dailyExtra').addEventListener('input', updateBudget);
      document.getElementById('numNights').addEventListener('input', updateBudget);
    }

    // ---------- APP INIT ----------
    function initApp() {
      buildStaticUI();
      listenVotes();
      startCommentListeners();
      initBudget();
    }
  </script>
</body>
</html>
